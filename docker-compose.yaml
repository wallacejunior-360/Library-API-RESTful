version: '3.9'

services:
  db:
    image: mysql:9.7.2
    # CORREÇÃO: O parâmetro --default-authentication-plugin foi totalmente removido do MySQL 9.x e impedia o container de subir.
    restart: always
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_USER: docker
      MYSQL_PASSWORD: admin123
      MYSQL_DATABASE: library
      MYSQL_ROOT_HOST: '%'
      MYSQL_TCP_PORT: 3308
    ports:
      - 3308:3308
    expose:
      - 3308
    networks:
      - library-network

  rest-library-api:
    image: wallace/rest-library-api
    restart: always
    build: ./
    working_dir: /library
    environment:
      TZ: America/Sao_Paulo # AJUSTE: Removido um caractere ']' órfão que quebrava a sintaxe aqui.
      SPRING.DATASOURCE.URL: jdbc:mysql://db:3308/library?useTimeZone=true&serverTimeZone=UTC
      SPRING.DATASOURCE.USERNAME: root
      SPRING.DATASOURCE.PASSWORD: admin123
    ports:
      - 80:80
    command: mvn spring-boot:run # AJUSTE: Corrigido o comando de 'mvm' para 'mvn' (Maven).
    depends_on:
      - db
    networks:
      - library-network

networks:
  library-network:
    driver: bridge
