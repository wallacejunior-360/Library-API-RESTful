name: Continuous Integration with Github Actions

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Setup Java JDK
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven' 
    
    - name: Build Application Jar
      # CORRIGIDO: working-directory removido para rodar na raiz do projeto
      env:
        MAVEN_OPTS: "-Xmx1024m -XX:MaxMetaspaceSize=512m" # Ajuda o Testcontainers liberando RAM
      run: mvn clean package -B -DskipTests

    - name: Upload Test Report (Runs only on failure)
      if: failure() # Garante que só roda se o passo anterior ('mvn clean package') falhar
      uses: actions/upload-artifact@v4
      with:
        name: surefire-test-reports
        path: '**/target/surefire-reports/*.txt'

    - name: Docker Compose build
      # CORRIGIDO: working-directory removido
      run: docker compose build

    - name: Push to Docker Hub Container registry
      run:  |
        docker tag wallace/rest-library-api ${{ secrets.DOCKER_USERNAME }}/rest-library-api:${{ github.run_id }} 
        docker tag wallace/rest-library-api ${{ secrets.DOCKER_USERNAME }}/rest-library-api:latest

        docker push ${{ secrets.DOCKER_USERNAME }}/rest-library-api:${{ github.run_id }} 
        docker push ${{ secrets.DOCKER_USERNAME }}/rest-library-api:latest
