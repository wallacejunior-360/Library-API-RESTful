name: Continuous Integration with Github Actions

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Setup Java JDK
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'     # CORRIGIDO: 'adopt' mudou para 'temurin'
        cache: 'maven' 
    
    - name: Build Application Jar  
      run: mvn clean package        # CORRIGIDO: 'clear' alterado para 'clean'

    - name: Docker Compose build
      run: docker compose build

    - name: Push to Docker Hub Container registry
      run:  |
        # Garanta que o nome 'wallace/rest-library-api' é exatamente o mesmo definido no seu docker-compose.yml
        docker tag wallace/rest-library-api ${{ secrets.DOCKER_USERNAME }}/rest-library-api:${{ github.run_id }} 
        docker tag wallace/rest-library-api ${{ secrets.DOCKER_USERNAME }}/rest-library-api:latest # ADICIONADO: Criando a tag latest localmente

        docker push ${{ secrets.DOCKER_USERNAME }}/rest-library-api:${{ github.run_id }} 
        docker push ${{ secrets.DOCKER_USERNAME }}/rest-library-api:latest
