cors:
  originPatterns: http://localhost:3000,http://localhost:8080,http://wallacejr.com.br

file:
  upload-dir: /home/runner/work/Library-API-RESTful//UploadDir

server:
  port: 8888

security:
  jwt:
    token:
      secret-key: 53cr37
      expire-length: 3600000

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false

  servlet:
    multipart:
      enabled: true  # <--- Corrigido aqui (adicionado o 'd')
      max-file-size: 10MB
      max-request-size: 10MB

  flyway:
    # Ativa ou desativa o Flyway
    enabled: true
    # Local padrão onde o Flyway buscará os arquivos SQL
    locations: classpath:db/migration
    # Se você quiser que o Flyway limpe o banco em ambiente de testes (cuidado em produção!)
    clean-disabled: true

  spring-doc:
    path-to-match:
      - /api/**/v1/**
    swagger-ui:
      use-root-path: true